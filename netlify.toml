# HS CAR'S — publicação na Netlify
#
# O projeto é exportado como HTML estático (next.config.mjs → output: 'export'),
# então não há função serverless envolvida: a Netlify serve tudo pelo CDN.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------------
# Segurança e privacidade
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

# Os bundles do Next carregam hash no nome: podem ser eternos.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens da marca mudam raramente, mas precisam poder ser revalidadas.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# O HTML sempre revalida, para que uma publicação nova apareça na hora.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
